<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkillForge | Challenges</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container app-layout" style="padding-top: 1.5rem; padding-bottom: 3rem;">
      <aside id="sidebar" class="sidebar"></aside>

      <main class="main-panel">
        <div class="panel-header">
          <div>
            <h1>Challenges</h1>
            <p class="subtitle">Practice with realistic, scenario-based problems.</p>
          </div>
          <button class="mobile-toggle" id="mobileToggle" aria-label="Open navigation">☰</button>
        </div>

        <section class="card soft">
          <p class="muted sm">Scenario</p>
          <h2 id="challengeScenario" style="margin-bottom: 1rem;">You are a security analyst...</h2>
          <div class="challenge-card" style="padding: 1.2rem;">
            <div>
              <h3 id="challengeQuestion">Question</h3>
              <div id="challengeOptions" class="option-list"></div>
              <button id="submitChallenge" class="btn" style="margin-top: 1rem;">Submit Answer</button>
            </div>
            <div>
              <div class="badge good">+50 XP</div>
              <div class="card" style="margin-top: 1rem; padding: 1rem;">
                <p class="muted sm">Difficulty: Medium</p>
              </div>
            </div>
          </div>
          <div id="challengeResult" class="answer-panel" hidden></div>
        </section>
      </main>
    </div>

    <script src="data.js"></script>
    <script src="store.js"></script>
    <script src="ui.js"></script>
    <script>
      const state = requireDomain();
      if (!state) {
        window.location.href = "login.html";
      } else {
        renderSidebar();

        const params = new URLSearchParams(window.location.search);
        const stageParam = params.get("stage");
        const domainQuestions = ASSESSMENTS[state.domain] || [];
        const targetStage = (ROADMAPS[state.domain] || []).find(item => item.id === stageParam) || null;
        const fallbackQuestion = domainQuestions.find(item => item.skill === (targetStage ? targetStage.skill : "Web Security")) || domainQuestions[0] || DAILY_CHALLENGE;

        const challenge = targetStage && fallbackQuestion && fallbackQuestion.q
          ? {
              scenario: `You are reviewing the ${targetStage.title} module and want to confirm your understanding before moving further.`,
              question: fallbackQuestion.q,
              options: fallbackQuestion.o,
              correctIndex: fallbackQuestion.a,
              explanation: `This question reinforces the core idea behind ${fallbackQuestion.skill}. Focus on the concept first, then cross-check the example you learned in this module.`,
              skill: fallbackQuestion.skill || "Fundamentals"
            }
          : {
              ...DAILY_CHALLENGE,
              skill: DAILY_CHALLENGE.skill || "Web Security"
            };

        const challengeScenario = document.getElementById("challengeScenario");
        const challengeQuestion = document.getElementById("challengeQuestion");
        const challengeOptions = document.getElementById("challengeOptions");
        const challengeResult = document.getElementById("challengeResult");
        const submitChallenge = document.getElementById("submitChallenge");

        challengeScenario.textContent = challenge.scenario;
        challengeQuestion.textContent = challenge.question;
        challengeOptions.innerHTML = challenge.options.map((option, index) => `
          <button type="button" class="option" data-index="${index}">${option}</button>
        `).join("");

        let selected = null;
        Array.from(document.querySelectorAll(".option")).forEach(button => {
          button.addEventListener("click", () => {
            document.querySelectorAll(".option").forEach(item => item.classList.remove("selected"));
            button.classList.add("selected");
            selected = Number(button.dataset.index);
          });
        });

        submitChallenge.addEventListener("click", () => {
          if (selected === null) {
            challengeResult.hidden = false;
            challengeResult.className = "answer-panel incorrect";
            challengeResult.innerHTML = "Please select an answer before submitting.";
            return;
          }

          const isCorrect = selected === challenge.correctIndex;
          const current = getState();
          const skill = challenge.skill;
          setSkillScore(current, skill, "challenge", isCorrect ? 100 : 45);

          if (stageParam && !current.completed.includes(stageParam)) {
            current.completed.push(stageParam);
          }
          if (stageParam && !current.completedLessons.includes(stageParam)) {
            current.completedLessons.push(stageParam);
          }

          const xpGain = isCorrect ? 50 : 10;
          awardChallengeResult(current, isCorrect, xpGain);
          saveState(current);

          challengeResult.hidden = false;
          challengeResult.className = `answer-panel ${isCorrect ? "correct" : "incorrect"}`;
          challengeResult.innerHTML = `
            <strong>${isCorrect ? "Correct!" : "Not quite."}</strong>
            <p>${challenge.explanation}</p>
            <p><strong>XP awarded:</strong> +${xpGain}</p>
          `;
        });
      }
    </script>
  </body>
</html>
